plugins {
    id 'application'
}

application {
    mainClass = 'com.bouncetales.desktop.DesktopLauncher'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// libGDX resuelve Gdx.files.internal(...) contra el directorio de trabajo.
tasks.named('run') {
    workingDir = rootProject.file('assets')
    setIgnoreExitValue(true)
}

// Pasa propiedades de la JVM al juego:  gradlew desktop:run -Dbounce.level=bg
tasks.named('run') {
    if (System.getProperty('bounce.level') != null) {
        systemProperty 'bounce.level', System.getProperty('bounce.level')
    }
    if (System.getProperty('bounce.menu') != null) {
        systemProperty 'bounce.menu', System.getProperty('bounce.menu')
    }
    if (System.getProperty('bounce.autocomplete') != null) {
        systemProperty 'bounce.autocomplete', System.getProperty('bounce.autocomplete')
    }
    if (System.getProperty('bounce.screenshot') != null) {
        systemProperty 'bounce.screenshot', System.getProperty('bounce.screenshot')
    }
    if (System.getProperty('bounce.frames') != null) {
        systemProperty 'bounce.frames', System.getProperty('bounce.frames')
    }
    if (System.getProperty('bounce.debug') != null) {
        systemProperty 'bounce.debug', System.getProperty('bounce.debug')
    }
    if (System.getProperty('bounce.trace') != null) {
        systemProperty 'bounce.trace', System.getProperty('bounce.trace')
    }
    if (System.getProperty('bounce.auto') != null) {
        systemProperty 'bounce.auto', System.getProperty('bounce.auto')
    }
    if (System.getProperty('bounce.drop') != null) {
        systemProperty 'bounce.drop', System.getProperty('bounce.drop')
    }
    if (System.getProperty('bounce.teleport') != null) {
        systemProperty 'bounce.teleport', System.getProperty('bounce.teleport')
    }
    if (System.getProperty('bounce.shape') != null) {
        systemProperty 'bounce.shape', System.getProperty('bounce.shape')
    }
    if (System.getProperty('bounce.face') != null) {
        systemProperty 'bounce.face', System.getProperty('bounce.face')
    }
    if (System.getProperty('bounce.die') != null) {
        systemProperty 'bounce.die', System.getProperty('bounce.die')
    }
    if (System.getProperty('bounce.muteMusic') != null) {
        systemProperty 'bounce.muteMusic', System.getProperty('bounce.muteMusic')
    }
    if (System.getProperty('bounce.muteFx') != null) {
        systemProperty 'bounce.muteFx', System.getProperty('bounce.muteFx')
    }
    if (System.getProperty('bounce.menuKeys') != null) {
        systemProperty 'bounce.menuKeys', System.getProperty('bounce.menuKeys')
    }
}
